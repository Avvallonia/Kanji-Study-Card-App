<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kanji Study — JLPT N5–N1</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kanji">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="Изучение японских кандзи JLPT N5–N1 с SRS-повторением">
<style>
:root {
  --bg: #0f1115;
  --card: #1a1d24;
  --card2: #222732;
  --border: #262b36;
  --text: #e6e9ef;
  --muted: #8b95a7;
  --accent: #6c9eff;
  --good: #4ade80;
  --bad: #f87171;
  --warn: #fbbf24;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 16px; overscroll-behavior-y: none;
  -webkit-font-smoothing: antialiased;
}
#app { display: flex; flex-direction: column; min-height: 100dvh; padding-bottom: env(safe-area-inset-bottom); }
header {
  position: sticky; top: 0; z-index: 10;
  background: rgba(15,17,21,0.9);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display: flex; align-items: center; justify-content: space-between;
}
header h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: 0.3px; }
header .badge {
  font-size: 12px; color: var(--muted);
  display: flex; align-items: center; gap: 6px;
  cursor: pointer; padding: 6px 10px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--border);
  user-select: none;
}
header .badge:active { background: var(--card2); }
header .badge .sep { opacity: 0.3; }
#menuBtn {
  background: none; border: 0; color: var(--text);
  padding: 6px; margin: -6px 6px -6px -8px;
  cursor: pointer; display: flex; align-items: center;
  border-radius: 8px;
}
#menuBtn:active { background: var(--card2); }
main { flex: 1; padding: 16px; max-width: 640px; margin: 0 auto; width: 100%; }
nav {
  position: sticky; bottom: 0; z-index: 10;
  background: rgba(15,17,21,0.95);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--border);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding-bottom: env(safe-area-inset-bottom);
}
nav button {
  background: none; border: 0; color: var(--muted); font-size: 10px;
  padding: 8px 2px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  cursor: pointer; font-family: inherit;
}
nav button .ico { font-size: 20px; line-height: 1; }
nav button.active { color: var(--accent); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 20px; margin-bottom: 14px; overflow: hidden; }
.flashcard {
  min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; user-select: none;
}
.flashcard .kanji {
  font-size: 96px; line-height: 1;
  font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  margin-bottom: 8px;
}
.flashcard .hint { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
.flashcard .back { width: 100%; text-align: left; }
.flashcard .back .meanings { margin-bottom: 14px; }
.row { display: flex; gap: 10px; margin: 8px 0; align-items: baseline; flex-wrap: wrap; }
.row .label {
  color: var(--muted); font-size: 11px; min-width: 44px;
  text-transform: uppercase; letter-spacing: 0.8px; font-weight: 500;
}
.row .val { word-break: break-word; min-width: 0; flex: 1; }

.examples { margin-top: 14px; border-top: 1px dashed var(--border); padding-top: 14px; }
.examples .ex {
  padding: 8px 0; font-size: 15px; line-height: 1.6;
  word-wrap: break-word; overflow-wrap: anywhere;
}
.examples .ex .w {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  font-size: 17px; color: var(--text);
}
.examples .ex .r {
  color: var(--muted); font-size: 14px;
}
.examples .ex .m {
  color: var(--text); font-size: 15px;
}

.flashcard .back .meanings,
.row .val,
.examples .ex .m {
  font-size: 16px; font-weight: 400;
  letter-spacing: 0.2px; line-height: 1.55; color: var(--text);
  word-wrap: break-word; overflow-wrap: anywhere;
}

.btn {
  display: flex; align-items: center; justify-content: center;
  padding: 14px 12px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--card2); color: var(--text);
  font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer;
  transition: transform 0.05s;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--accent); color: #0b1020; border-color: var(--accent); font-weight: 600; }
.btn-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.btn-row-2 .btn[disabled] { opacity: 0.4; cursor: default; }
.bar { height: 6px; background: var(--card2); border-radius: 999px; overflow: hidden; margin-top: 8px; }
.bar .fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.3s; }

/* Quiz */
.quiz-q { text-align: center; padding: 24px 12px; }
.quiz-q .big {
  font-size: 84px; line-height: 1;
  font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  cursor: pointer; user-select: none; transition: transform 0.1s;
}
.quiz-q .big:active { transform: scale(0.96); }
.quiz-q .prompt { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.quiz-q .hint-tip { color: var(--muted); font-size: 11px; margin-top: 10px; opacity: 0.6; }
.quiz-q .readings-hint {
  margin-top: 12px; padding-top: 12px;
  border-top: 1px dashed var(--border);
  font-size: 15px; color: var(--muted);
  animation: fadeIn 0.2s;
}
.quiz-q .readings-hint b { color: var(--text); font-weight: 500; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.opts { display: grid; gap: 10px; }
.opt {
  padding: 16px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--card2); color: var(--text); font-family: inherit; font-size: 16px;
  cursor: pointer; text-align: left;
  word-wrap: break-word; overflow-wrap: anywhere;
}
.opt.correct { background: rgba(74,222,128,0.15); border-color: var(--good); color: var(--good); }
.opt.wrong { background: rgba(248,113,113,0.15); border-color: var(--bad); color: var(--bad); }
.opt:disabled { cursor: default; opacity: 0.85; }

/* Browse */
.search {
  width: 100%; padding: 12px 14px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--card);
  color: var(--text); font-family: inherit; font-size: 15px; margin-bottom: 12px;
}
.search:focus { outline: none; border-color: var(--accent); }
.klist { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.kitem {
  aspect-ratio: 1; background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; display: flex; align-items: center; justify-content: center;
  font-size: 30px; font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  cursor: pointer; position: relative;
}
.kitem .dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
.kitem[data-status="learning"] .dot { background: var(--warn); }
.kitem[data-status="review"] .dot { background: var(--good); }
.kitem[data-status="new"] .dot { background: var(--accent); }

/* Stats */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
.stat .n { font-size: 26px; font-weight: 700; }
.stat .l { font-size: 12px; color: var(--muted); margin-top: 2px; }
h2 { font-size: 15px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; margin: 20px 0 10px; }
.empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }
.empty .big { font-size: 48px; margin-bottom: 8px; opacity: 0.4; }

/* Home */
.home-hero {
  background: linear-gradient(135deg, #1a1f2e 0%, #151824 100%);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 24px 20px;
  text-align: center;
  margin-bottom: 16px;
}
.home-hero .streak-num {
  font-size: 52px; font-weight: 700;
  background: linear-gradient(135deg, #fbbf24, #f97316);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1;
}
.home-hero .streak-lbl { color: var(--muted); font-size: 13px; margin-top: 6px; }
.calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 12px; }
.cal-cell {
  aspect-ratio: 1; border-radius: 5px;
  background: var(--card2); border: 1px solid var(--border);
}
.cal-cell[data-lvl="1"] { background: rgba(108,158,255,0.25); border-color: rgba(108,158,255,0.4); }
.cal-cell[data-lvl="2"] { background: rgba(108,158,255,0.5); border-color: rgba(108,158,255,0.6); }
.cal-cell[data-lvl="3"] { background: rgba(108,158,255,0.75); border-color: rgba(108,158,255,0.85); }
.cal-cell[data-lvl="4"] { background: var(--accent); border-color: var(--accent); }
.cal-legend { display: flex; gap: 6px; align-items: center; justify-content: flex-end; margin-top: 8px; font-size: 10px; color: var(--muted); }
.cal-legend .sw { width: 10px; height: 10px; border-radius: 3px; }
.level-prog { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
.level-prog .name { font-weight: 500; }
.level-prog .pct { color: var(--muted); }
.level-prog .pct b { color: var(--accent); }
.big-cta {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--accent), #a78bfa);
  color: #0b1020; border: 0; border-radius: 18px;
  padding: 22px 20px; width: 100%;
  font-family: inherit; font-size: 17px; font-weight: 700;
  cursor: pointer; margin-bottom: 14px;
  box-shadow: 0 10px 30px rgba(108,158,255,0.25);
  transition: transform 0.08s;
}
.big-cta:active { transform: scale(0.985); }
.big-cta .sub { font-size: 12px; font-weight: 500; opacity: 0.75; margin-top: 6px; }

/* Drawer */
#drawerOverlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55);
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
  z-index: 200;
}
#drawerOverlay.open { opacity: 1; pointer-events: auto; }
#drawer {
  position: fixed; top: 0; left: 0; bottom: 0;
  width: 260px; max-width: 80vw;
  background: var(--card);
  border-right: 1px solid var(--border);
  transform: translateX(-100%); transition: transform 0.22s ease;
  z-index: 201;
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}
#drawer.open { transform: translateX(0); }
.drawer-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 18px 12px; border-bottom: 1px solid var(--border);
}
.drawer-title {
  font-size: 13px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600;
}
#drawerClose {
  background: none; border: 0; color: var(--muted);
  font-size: 18px; cursor: pointer; padding: 4px 8px;
  border-radius: 8px; font-family: inherit;
}
#drawerClose:active { background: var(--card2); }
#levelList { padding: 8px 0; overflow-y: auto; }
#levelList button {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; padding: 12px 18px;
  background: none; border: 0; color: var(--text);
  font-family: inherit; font-size: 15px;
  cursor: pointer; text-align: left;
  border-left: 3px solid transparent;
}
#levelList button:hover { background: var(--card2); }
#levelList button.active {
  background: rgba(108,158,255,0.1);
  border-left-color: var(--accent);
  color: var(--accent); font-weight: 600;
}
#levelList button .n {
  font-size: 12px; color: var(--muted);
  background: var(--card2); padding: 2px 8px;
  border-radius: 999px;
}
#levelList button.active .n { background: var(--accent); color: #0b1020; }

/* Badge popup */
#badgePop {
  position: fixed; top: calc(env(safe-area-inset-top) + 52px); right: 12px;
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 14px; padding: 14px 16px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  z-index: 150; max-width: 280px;
  opacity: 0; pointer-events: none; transform: translateY(-6px);
  transition: opacity 0.18s, transform 0.18s;
  font-size: 13px; line-height: 1.5;
}
#badgePop.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
#badgePop .row2 { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
#badgePop .row2 + .row2 { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 10px; }
#badgePop .ico2 { font-size: 18px; line-height: 1; flex-shrink: 0; }
#badgePop .txt { color: var(--muted); font-size: 12px; }
#badgePop .txt b { color: var(--text); font-weight: 600; }

/* Confirm modal */
.modal-overlay {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
  padding: 20px;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal-box {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 18px; padding: 24px;
  max-width: 340px; width: 100%;
  transform: scale(0.95); transition: transform 0.2s;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.modal-overlay.open .modal-box { transform: scale(1); }
.modal-title {
  font-size: 16px; font-weight: 600; text-align: center;
  margin-bottom: 20px; line-height: 1.4;
}
.modal-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 80px);
  transform: translateX(-50%) translateY(20px);
  background: var(--card2); color: var(--text);
  padding: 10px 16px; border-radius: 999px; font-size: 13px;
  border: 1px solid var(--border); opacity: 0; transition: all 0.25s;
  pointer-events: none; z-index: 100;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.canvas-wrap { position: relative; width: 100%; aspect-ratio: 1; max-width: 240px; margin: 0 auto; }
canvas { width: 100%; height: 100%; background: #f7f7f7; border-radius: 12px; touch-action: none; display: block; }
.canvas-bg {
  position: absolute; inset: 0; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 140px; font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  color: #e0e0e0; user-select: none;
}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="menuBtn" aria-label="Меню">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <h1>漢 Kanji Study</h1>
    <div class="badge" id="headerBadge"></div>
  </header>
  <main id="view"></main>
  <nav>
    <button data-tab="home"><span class="ico">🏠</span>Главная</button>
    <button data-tab="practice"><span class="ico">🎯</span>Практика</button>
    <button data-tab="browse"><span class="ico">📚</span>Все</button>
    <button data-tab="stats"><span class="ico">📊</span>Стата</button>
  </nav>
</div>
<div id="badgePop"></div>
<div id="drawerOverlay"></div>
<aside id="drawer">
  <div class="drawer-header">
    <div class="drawer-title">Уровни JLPT</div>
    <button id="drawerClose" aria-label="Закрыть">✕</button>
  </div>
  <div id="levelList"></div>
</aside>
<div class="modal-overlay" id="confirmModal">
  <div class="modal-box">
    <div class="modal-title" id="confirmTitle"></div>
    <div class="modal-buttons">
      <button class="btn" id="confirmNo">Нет</button>
      <button class="btn btn-primary" id="confirmYes">Да</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="kanji_data.js"></script>
<script src="bkb_data.js"></script>
<script src="kanji_ru.js"></script>
<script src="warodai_mini.js"></script>

<script>
/* ====================== УТИЛИТЫ ====================== */
function capFirst(s) {
  if (!s) return s;
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function cleanMeaning(s) {
  if (!s) return '';
  let t = String(s);

  // Годы и века: 1570.IV, 1573.VII, 1570.IV — 1573.VII
  t = t.replace(/\b\d{3,4}\s*\.\s*[IVX]+(\s*[—–-]\s*\d{3,4}\s*\.\s*[IVX]+)?/g, ' ');

  // Мусор: "10000 てぃちょう" — большое число + кана
  t = t.replace(/\b\d{4,}\s*[ぁ-ゟァ-ヿ]+/g, ' ');

  // Нумерация "1) ", "12) "
  t = t.replace(/(^|\s)\d+\)\s*/g, '$1');

  // Множественные пробелы
  t = t.replace(/\s+/g, ' ').trim();

  // Длинные описания в скобках (больше 50 символов) — убираем,
  // но НЕ трогаем {～の}, 【...】 и короткие (кн.), (суф.)
  t = t.replace(/\(([^)]{50,})\)/g, '');

  // Убираем висячие пустые скобки
  t = t.replace(/\s*\(\s*\)/g, ' ');

  // Хвостовая/ведущая пунктуация (кроме закрывающих скобок и точек внутри пометок)
  t = t.replace(/^[\s.,;:\[\]—-]+|[\s.,;:\[\]—-]+$/g, '');

  t = t.replace(/\s+/g, ' ').trim();

  // Обрезаем слишком длинное
  if (t.length > 120) t = t.slice(0, 117).trim() + '…';

  return capFirst(t);
}

// Проверяем, что значение похоже на осмысленный текст
function isMeaningValid(s) {
  if (!s || s.length < 2) return false;
  // Должна быть хотя бы одна кириллическая/латинская буква
  if (!/[а-яёa-z]/i.test(s)) return false;
  // Если строка начинается с цифр и содержит кана — это мусор
  if (/^\d+\s*[ぁ-ゟァ-ヿ]/.test(s)) return false;
  return true;
}

/* ====================== ПАРСИНГ ====================== */
function parseData(raw) {
  return raw.split('\n').map(line => {
    const parts = line.split('|');
    if (parts.length < 4) return null;
    const [k, level, meaningsRaw, on, kun, ex] = parts;

        // ПРИОРИТЕТ 1: примеры из BKB (Basic Kanji Book)
    let examples = [];
    if (typeof BKB !== 'undefined' && BKB[k.trim()] && BKB[k.trim()].ex) {
      examples = BKB[k.trim()].ex.map(s => ({ raw: s }));
    }
    // ПРИОРИТЕТ 2: сборка из kanji_data + Warodai (как раньше)
    if (examples.length === 0) {
      examples = (ex || '').split(';').map(s => {
        const seg = s.split(':');
        if (seg.length < 2) return null;
        const w = seg[0].trim();
        const r = (seg[1] || '').trim();
        let m = '';
        if (typeof WARODAI !== 'undefined') {
          m = WARODAI[`${w}:${r}`] || WARODAI[`${w}:`] || '';
        }
        if (!m) m = seg.slice(2).join(':').trim();
        return w ? { word: w, reading: r, meaning: cleanMeaning(m) } : null;
      }).filter(Boolean);
    }

       const kanjiKey = k.trim();
    let kanjiMeanings = null;

    // ПРИОРИТЕТ 1: BKB — значение из Basic Kanji Book
    if (typeof BKB !== 'undefined' && BKB[kanjiKey] && BKB[kanjiKey].m) {
      const cleaned = cleanMeaning(BKB[kanjiKey].m);
      if (isMeaningValid(cleaned)) kanjiMeanings = [cleaned];
    }

    // ПРИОРИТЕТ 2: KANJI_RU — русский перевод из KanjiStudy_jpn-rus
    if (!kanjiMeanings && typeof KANJI_RU !== 'undefined' && KANJI_RU[kanjiKey]) {
      const cleaned = cleanMeaning(KANJI_RU[kanjiKey]);
      if (isMeaningValid(cleaned)) kanjiMeanings = [cleaned];
    }

    // ПРИОРИТЕТ 2: WARODAI — если кандзи сам по себе является словом
    if (!kanjiMeanings && typeof WARODAI !== 'undefined' && WARODAI[`${kanjiKey}:`]) {
      const cleaned = cleanMeaning(WARODAI[`${kanjiKey}:`]);
      if (isMeaningValid(cleaned)) kanjiMeanings = [cleaned];
    }

    // ПРИОРИТЕТ 3: значения из kanji_data.js (англ./смешанные)
    if (!kanjiMeanings) {
      kanjiMeanings = meaningsRaw.split(/[,;]/)
        .map(s => cleanMeaning(s.trim()))
        .filter(s => s && isMeaningValid(s));
    }

    if (!kanjiMeanings || kanjiMeanings.length === 0) {
      kanjiMeanings = [cleanMeaning(meaningsRaw) || '—'];
    }

    return {
      kanji: kanjiKey,
      level: (level || 'N5').trim(),
      meanings: kanjiMeanings,
      on: on.split(',').map(s => s.trim()).filter(Boolean),
      kun: kun.split(',').map(s => s.trim().replace(/\./g, '')).filter(Boolean),
      examples
    };
  }).filter(Boolean);
}

if (typeof KANJI_DB === 'undefined') {
  document.getElementById('view').innerHTML =
    '<div class="empty"><div class="big">⚠️</div><p>Файл kanji_data.js не найден.</p></div>';
  throw new Error('KANJI_DB missing');
}

const DATA = parseData(KANJI_DB);
const BY_KANJI = Object.fromEntries(DATA.map(d => [d.kanji, d]));
const LEVELS = ['N5', 'N4', 'N3', 'N2', 'N1'];
const LEVEL_COUNTS = LEVELS.reduce((acc, lv) => {
  acc[lv] = DATA.filter(d => d.level === lv).length;
  return acc;
}, {});
const TOTAL = DATA.length;

/* ====================== СОСТОЯНИЕ ====================== */
const STORAGE_KEY = 'kanji-study-v3';
const state = {
  progress: {},
  settings: { newPerDay: 10 },
  tab: 'home',
  levelFilter: 'all',
  studyQueue: [],
  studyIndex: 0,
  session: null,
  quiz: null,
  history: {},       // все события по дням
  historyNew: {}     // только новые изученные
};

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      Object.assign(state, {
        progress: saved.progress || {},
        settings: saved.settings || state.settings,
        levelFilter: saved.levelFilter || 'all',
        history: saved.history || {},
        historyNew: saved.historyNew || {}
      });
    }
  } catch (e) { console.warn('Load failed', e); }
}
function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      progress: state.progress,
      settings: state.settings,
      levelFilter: state.levelFilter,
      history: state.history,
      historyNew: state.historyNew
    }));
  } catch (e) { console.warn('Save failed', e); }
}

/* ====================== SRS ====================== */
const DAY = 24 * 60 * 60 * 1000;
const MIN = 60 * 1000;

function getCard(k) {
  return state.progress[k] || {
    interval: 0, ease: 2.5, reps: 0, lapses: 0,
    due: 0, status: 'new', lastReview: 0,
    correct: 0, wrong: 0
  };
}

function getMastery(c) {
  if (!c || c.status === 'new') return 0;
  const correct = c.correct || 0;
  const wrong = c.wrong || 0;
  const total = correct + wrong;
  const acc = total >= 2 ? (correct / total) : 0.5;
  const maturity = c.interval === 0 ? 0.1 : Math.min(1, Math.log(c.interval + 1) / Math.log(22));
  return Math.round((acc * 0.5 + maturity * 0.5) * 100);
}

function review(k, quality, wasCorrect) {
  const c = { ...getCard(k) };
  const now = Date.now();
  c.reps++;
  c.lastReview = now;

  if (wasCorrect === true) c.correct = (c.correct || 0) + 1;
  else if (wasCorrect === false) c.wrong = (c.wrong || 0) + 1;

  if (quality === 0) {
    c.lapses++;
    c.ease = Math.max(1.3, c.ease - 0.2);
    c.interval = 0;
    c.status = 'learning';
    c.due = now + MIN;
  } else {
    if (quality === 1) { c.ease = Math.max(1.3, c.ease - 0.15); c.interval = c.interval === 0 ? 1 : Math.max(1, c.interval * 1.2); }
    else if (quality === 2) { c.interval = c.interval === 0 ? 1 : c.interval * c.ease; }
    else { c.ease = Math.min(3.0, c.ease + 0.15); c.interval = c.interval === 0 ? 3 : c.interval * c.ease * 1.3; }
    c.status = c.reps >= 2 ? 'review' : 'learning';
    c.due = now + c.interval * DAY;
  }
  state.progress[k] = c;

  const today = new Date().toISOString().slice(0, 10);
  state.history[today] = (state.history[today] || 0) + 1;
  save();
}

/* ====================== ФИЛЬТРЫ ====================== */
function byLevel(arr) {
  return state.levelFilter === 'all' ? arr : arr.filter(d => d.level === state.levelFilter);
}
function dueCards(pool) {
  const now = Date.now();
  const src = pool || byLevel(DATA);
  return src.filter(d => {
    const c = getCard(d.kanji);
    return c.status !== 'new' && c.due <= now;
  });
}
function newCards(pool) {
  const src = pool || byLevel(DATA);
  return src.filter(d => getCard(d.kanji).status === 'new');
}
function studiedCards(pool) {
  const src = pool || DATA;
  return src.filter(d => getCard(d.kanji).status !== 'new');
}
function buildStudyQueue() {
  const due = dueCards().sort((a, b) => getCard(a.kanji).due - getCard(b.kanji).due);
  const nw = newCards().slice(0, state.settings.newPerDay);
  return [...due, ...nw];
}

/* ====================== UI ====================== */
const view = document.getElementById('view');
const headerBadge = document.getElementById('headerBadge');
const levelList = document.getElementById('levelList');
const drawer = document.getElementById('drawer');
const drawerOverlay = document.getElementById('drawerOverlay');

function renderLevelBar() {
  const items = [{ id: 'all', label: 'Все уровни', n: TOTAL }]
    .concat(LEVELS.map(lv => ({ id: lv, label: lv, n: LEVEL_COUNTS[lv] })));
  levelList.innerHTML = items.map(it => `
    <button class="${state.levelFilter === it.id ? 'active' : ''}" onclick="setLevel('${it.id}')">
      <span>${it.label}</span>
      <span class="n">${it.n}</span>
    </button>`).join('');
}
function openDrawer() {
  renderLevelBar();
  drawer.classList.add('open');
  drawerOverlay.classList.add('open');
}
function closeDrawer() {
  drawer.classList.remove('open');
  drawerOverlay.classList.remove('open');
}
function setLevel(lv) {
  state.levelFilter = lv;
  state.studyQueue = [];
  state.studyIndex = 0;
  state.session = null;
  state.quiz = null;
  closeDrawer();
  save(); render();
}

function calcStreak() {
  let streak = 0;
  const d = new Date();
  for (let i = 0; i < 365; i++) {
    const key = d.toISOString().slice(0, 10);
    if (state.history[key] > 0) { streak++; d.setDate(d.getDate() - 1); }
    else if (i === 0) { d.setDate(d.getDate() - 1); }
    else break;
  }
  return streak;
}

function updateHeaderBadge() {
  const due = dueCards().length;
  const nw = Math.min(newCards().length, state.settings.newPerDay);
  const today = new Date().toISOString().slice(0, 10);
  const done = state.history[today] || 0;
  const streak = calcStreak();
  headerBadge.innerHTML = `
    <span>📅 ${done}</span>
    <span class="sep">·</span>
    <span>🔔 ${due + nw}</span>
    <span class="sep">·</span>
    <span>🔥 ${streak}</span>`;
}

function render() {
  document.querySelectorAll('nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === state.tab);
  });
  if (state.tab === 'home') renderHome();
  if (state.tab === 'study') renderStudy();
  if (state.tab === 'practice') renderPractice();
  if (state.tab === 'browse') renderBrowse();
  if (state.tab === 'stats') renderStats();
  updateHeaderBadge();
}

/* ====================== HOME ====================== */
function renderHome() {
  const streak = calcStreak();
  const today = new Date().toISOString().slice(0, 10);
  const todayTotal = state.history[today] || 0;
  const todayNew = state.historyNew[today] || 0;
  const todayReviews = Math.max(0, todayTotal - todayNew);

  // Календарь на 35 дней
  const cells = [];
  const now = new Date();
  for (let i = 34; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0, 10);
    const c = state.history[key] || 0;
    let lvl = 0;
    if (c > 0 && c <= 5) lvl = 1;
    else if (c <= 15) lvl = 2;
    else if (c <= 30) lvl = 3;
    else if (c > 30) lvl = 4;
    const isToday = key === today;
    cells.push(`<div class="cal-cell" data-lvl="${lvl}" ${isToday ? 'style="box-shadow:0 0 0 1.5px var(--warn)"' : ''}></div>`);
  }

  // Прогресс по уровням
  const levelProg = LEVELS.map(lv => {
    const inLv = DATA.filter(d => d.level === lv);
    const done = inLv.filter(d => getCard(d.kanji).status !== 'new').length;
    const pct = inLv.length ? Math.round(done / inLv.length * 100) : 0;
    return `
      <div style="margin-bottom:12px;">
        <div class="level-prog">
          <span class="name">${lv}</span>
          <span class="pct"><b>${pct}%</b> · ${done}/${inLv.length}</span>
        </div>
        <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
      </div>`;
  }).join('');

  const newAvail = Math.min(newCards().length, state.settings.newPerDay);
  const dueAvail = dueCards().length;
  const remainingNew = newCards().length;

  // Подпись кнопки — только про новые
  let ctaSubtitle;
  if (newAvail > 0) ctaSubtitle = `${newAvail} новых`;
  else if (remainingNew > 0) ctaSubtitle = 'Все на сегодня изучены';
  else ctaSubtitle = 'Все кандзи изучены';

  view.innerHTML = `
    <div class="home-hero">
      <div class="streak-num">🔥 ${streak}</div>
      <div class="streak-lbl">${streak === 0 ? 'Начни заниматься сегодня' :
        streak === 1 ? 'день подряд' :
        streak < 5 ? 'дня подряд' : 'дней подряд'}</div>
      <div class="calendar">${cells.join('')}</div>
      <div class="cal-legend">
        <span>меньше</span>
        <span class="sw" style="background:var(--card2);border:1px solid var(--border);"></span>
        <span class="sw" style="background:rgba(108,158,255,0.25);"></span>
        <span class="sw" style="background:rgba(108,158,255,0.5);"></span>
        <span class="sw" style="background:rgba(108,158,255,0.75);"></span>
        <span class="sw" style="background:var(--accent);"></span>
        <span>больше</span>
      </div>
    </div>

    <button class="big-cta" onclick="startToday()">
      📚 Сегодняшние кандзи
      <span class="sub">${ctaSubtitle}</span>
    </button>

    <h2>Прогресс по уровням</h2>
    <div class="card">${levelProg}</div>

    <h2>Сегодня</h2>
    <div class="stat-grid">
      <div class="stat"><div class="n">${todayReviews}</div><div class="l">Повторили</div></div>
      <div class="stat"><div class="n">${todayNew}</div><div class="l">Изучено новых</div></div>
    </div>`;
}

/* ====================== СЕГОДНЯШНИЙ ФЛОУ ====================== */
function startToday() {
  const studied = studiedCards();
  const newAvail = Math.min(newCards().length, state.settings.newPerDay);
  const due = dueCards().slice(0, 10);

  // Если есть что делать — запускаем обычный флоу
  if (due.length > 0 || newAvail > 0) {
    let reviewItems = [];
    if (due.length > 0) {
      reviewItems = shuffle(due).slice(0, 10);
    } else if (studied.length >= 10) {
      reviewItems = shuffle(studied).slice(0, 10);
    } else if (studied.length > 0) {
      reviewItems = shuffle(studied);
    }

    state.session = {
      stage: null,
      newStudied: [],
      newAvailCount: newAvail
    };

    if (due.length > 0 && reviewItems.length > 0) {
      state.session.stage = 'review';
      state.tab = 'practice';
      startQuiz(reviewItems, 'mixed', 'today-review');
      render();
    } else if (newAvail > 0) {
      state.session.stage = 'study';
      state.studyQueue = buildStudyQueue();
      state.studyIndex = 0;
      sessionReviewed = new Set();
      state.tab = 'study';
      render();
    } else if (reviewItems.length > 0) {
      state.session.stage = 'review';
      state.tab = 'practice';
      startQuiz(reviewItems, 'mixed', 'today-review');
      render();
    }
    return;
  }

  // Всё сделано — предлагаем изучить ещё
  if (newCards().length > 0) {
    showConfirm('Хотите изучить ещё кандзи?', () => {
      state.session = { stage: 'study', newStudied: [] };
      state.studyQueue = newCards().slice(0, state.settings.newPerDay);
      state.studyIndex = 0;
      sessionReviewed = new Set();
      state.tab = 'study';
      render();
    });
  } else {
    toast('Все кандзи изучены! 🎉');
  }
}

/* ====================== STUDY ====================== */
function renderStudy() {
  if (state.studyQueue.length === 0) {
    state.studyQueue = buildStudyQueue();
    state.studyIndex = 0;
  }

  if (state.studyIndex >= state.studyQueue.length) {
    const today = new Date().toISOString().slice(0, 10);
    const inSession = state.session && state.session.stage === 'study';

    if (inSession) {
      const studied = state.studyQueue.filter(d => getCard(d.kanji).status !== 'new');
      state.session.newStudied = studied;
      state.session.stage = 'quiz';
      state.studyQueue = [];
      state.studyIndex = 0;
      if (studied.length > 0) {
        state.tab = 'practice';
        startQuiz(shuffle(studied), 'mixed', 'today-quiz-new');
        render();
      } else {
        state.session = null;
        state.tab = 'home';
        render();
      }
      return;
    }

    view.innerHTML = `
      <div class="empty">
        <div class="big">🎉</div>
        <p>Карточки закончились</p>
        <button class="btn btn-primary" style="margin-top:20px;" onclick="state.tab='home'; render();">На главную</button>
      </div>`;
    return;
  }

  const d = state.studyQueue[state.studyIndex];
  const c = getCard(d.kanji);
  const statusLabel = { new: 'Новая', learning: 'Учится', review: 'Повтор' }[c.status];
  const mastery = getMastery(c);

  view.innerHTML = `
    <div class="card flashcard">
      <div class="kanji">${d.kanji}</div>
      <div class="hint">${statusLabel} · ${d.level} · ${mastery}%</div>
      <div class="back">
        <div class="meanings">${d.meanings.join(', ')}</div>
        ${d.on.length ? `<div class="row"><span class="label">On</span><span class="val">${d.on.join('、')}</span></div>` : ''}
        ${d.kun.length ? `<div class="row"><span class="label">Kun</span><span class="val">${d.kun.join('、')}</span></div>` : ''}
        ${d.examples.length ? `
          <div class="examples">
            ${d.examples.map(e => e.raw
              ? `<div class="ex">${e.raw}</div>`
              : `<div class="ex"><span class="w">${e.word}</span><span class="r">(${e.reading})</span> <span class="m">${e.meaning}</span></div>`
            ).join('')}
          </div>` : ''}
      </div>
    </div>
    <div class="btn-row-2">
      <button class="btn" ${state.studyIndex === 0 ? 'disabled' : ''} onclick="prevCard()">← Предыдущий</button>
      <button class="btn btn-primary" onclick="nextCard()">Следующий →</button>
    </div>
    <div style="color:var(--muted); font-size:12px; text-align:center; margin-top:10px;">
      ${state.studyIndex + 1} / ${state.studyQueue.length}
    </div>`;
}

let sessionReviewed = new Set();

function nextCard() {
  const d = state.studyQueue[state.studyIndex];
  if (!sessionReviewed.has(d.kanji)) {
    const wasNew = getCard(d.kanji).status === 'new';
    review(d.kanji, 2, undefined);
    if (wasNew) {
      const today = new Date().toISOString().slice(0, 10);
      state.historyNew[today] = (state.historyNew[today] || 0) + 1;
      save();
    }
    sessionReviewed.add(d.kanji);
  }
  state.studyIndex++;
  renderStudy();
  updateHeaderBadge();
}
function prevCard() {
  if (state.studyIndex === 0) return;
  state.studyIndex--;
  renderStudy();
}

/* ====================== PRACTICE ====================== */
function renderPractice() {
  if (!state.quiz) {
    const pool = studiedCards();
    view.innerHTML = `
      <h2>Практика</h2>
      <div class="card" style="padding:16px 20px;">
        <div style="color:var(--muted); font-size:13px; line-height:1.6;">
          Смешанный тест по всем изученным кандзи.<br>
          Вопросы выбираются случайно: значение → кандзи, кандзи → значение, кандзи → чтение.
        </div>
      </div>
      <button class="big-cta" onclick="startPractice()">
        🎯 Начать практику
        <span class="sub">${pool.length} кандзи изучено</span>
      </button>
      <p style="color:var(--muted); font-size:12px; text-align:center; margin-top:16px;">
        Тест берёт до 20 случайных кандзи из всех уровней.
      </p>`;
    return;
  }

  const q = state.quiz;
  const item = q.item;
  const modeLabel = {
    kanji2meaning: 'Что значит этот кандзи?',
    kanji2reading: 'Кунное чтение?',
    meaning2kanji: 'Выбери кандзи'
  }[q.currentMode];

  if (q.currentMode === 'kanji2meaning' || q.currentMode === 'kanji2reading') {
    view.innerHTML = `
      <div class="card quiz-q">
        <div class="prompt">${modeLabel}</div>
        <div class="big" onclick="toggleHint()">${item.kanji}</div>
        <div class="hint-tip">Нажми на кандзи, чтобы увидеть подсказку</div>
        ${q.hintShown ? `
          <div class="readings-hint">
            ${item.on.length ? `<div>On: <b>${item.on.join('、')}</b></div>` : ''}
            ${item.kun.length ? `<div style="margin-top:4px;">Kun: <b>${item.kun.join('、')}</b></div>` : ''}
          </div>` : ''}
      </div>
      <div class="opts">
        ${q.options.map((opt, i) => `<button class="opt" ${q.answered ? 'disabled' : ''} data-i="${i}" onclick="quizAnswer(${i})">${opt}</button>`).join('')}
      </div>
      ${q.answered ? `<button class="btn btn-primary" style="width:100%; margin-top:14px;" onclick="nextQuiz()">Дальше →</button>` : ''}
      <div style="color:var(--muted); font-size:12px; text-align:center; margin-top:12px;">${q.done} / ${q.total} · Правильно: ${q.correct}</div>`;
    return;
  }

  view.innerHTML = `
    <div class="card quiz-q">
      <div class="prompt">${modeLabel}</div>
      <div style="font-size:22px; font-weight:600; margin:14px 0; word-wrap:break-word;">${item.meanings.join(', ')}</div>
    </div>
    <div class="opts">
      ${q.options.map((opt, i) => `<button class="opt" ${q.answered ? 'disabled' : ''} style="font-size:28px; text-align:center; font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;" data-i="${i}" onclick="quizAnswer(${i})">${opt}</button>`).join('')}
    </div>
    ${q.answered ? `<button class="btn btn-primary" style="width:100%; margin-top:14px;" onclick="nextQuiz()">Дальше →</button>` : ''}
    <div style="color:var(--muted); font-size:12px; text-align:center; margin-top:12px;">${q.done} / ${q.total} · Правильно: ${q.correct}</div>`;
}

function toggleHint() {
  if (!state.quiz) return;
  state.quiz.hintShown = !state.quiz.hintShown;
  renderPractice();
}

function startQuiz(items, mode, tag) {
  if (!items || items.length === 0) return;
  const selected = items.slice(0, 20);
  state.quiz = {
    mode: mode || 'mixed',
    questions: selected,
    total: selected.length,
    done: 0,
    correct: 0,
    tag: tag || null,
    currentMode: null,
    hintShown: false
  };
  nextQuiz();
}

function startPractice() {
  const pool = shuffle(studiedCards());
  if (pool.length < 4) { toast('Изучи хотя бы 4 кандзи'); return; }
  state.tab = 'practice';
  state.session = null;
  startQuiz(pool.slice(0, 20), 'mixed', 'practice');
  render();
}

function pickModeFor(item) {
  const modes = ['kanji2meaning', 'kanji2reading', 'meaning2kanji'];
  if (!item.kun.length) return modes[Math.floor(Math.random() * 2)];
  return modes[Math.floor(Math.random() * 3)];
}

function nextQuiz() {
  const q = state.quiz;
  if (!q) return;
  if (q.done >= q.total) {
    const finishedTag = q.tag;
    const correct = q.correct;
    const total = q.total;
    state.quiz = null;

    if (finishedTag === 'today-review') {
      view.innerHTML = `
        <div class="empty">
          <div class="big">✅</div>
          <p>Повторение завершено!</p>
          <p style="font-size:16px; margin-top:8px;">${correct} / ${total}</p>
          <button class="btn btn-primary" style="width:100%; margin-top:20px;" onclick="continueAfterReview()">Перейти к изучению →</button>
        </div>`;
      return;
    }
    if (finishedTag === 'today-quiz-new') {
      view.innerHTML = `
        <div class="empty">
          <div class="big">🎉</div>
          <p>Все задания на сегодня выполнены!</p>
          <p style="font-size:16px; margin-top:8px;">Тест: ${correct} / ${total}</p>
          <button class="btn btn-primary" style="width:100%; margin-top:20px;" onclick="finishToday()">Готово</button>
        </div>`;
      return;
    }

    view.innerHTML = `
      <div class="empty">
        <div class="big">🏁</div>
        <p>Тест завершён!</p>
        <p style="font-size:18px; margin-top:12px;">${correct} / ${total}</p>
        <button class="btn btn-primary" style="width:100%; margin-top:20px;" onclick="state.quiz=null; render();">Ещё раз</button>
      </div>`;
    return;
  }

  const item = q.questions[q.done];
  q.currentMode = (q.mode === 'mixed') ? pickModeFor(item) : q.mode;
  q.hintShown = false;

  let correct, key;
  if (q.currentMode === 'kanji2meaning') { correct = item.meanings[0]; key = d => d.meanings[0]; }
  else if (q.currentMode === 'kanji2reading') { correct = item.kun[0] || item.on[0]; key = d => d.kun[0] || d.on[0]; }
  else { correct = item.kanji; key = d => d.kanji; }

  const others = shuffle(
    DATA.filter(d => d.kanji !== item.kanji && key(d) && key(d) !== correct)
  );
  const seenOptions = new Set([correct]);
  const distractors = [];
  for (const d of others) {
    const opt = key(d);
    if (opt && !seenOptions.has(opt)) {
      seenOptions.add(opt);
      distractors.push(opt);
    }
    if (distractors.length === 3) break;
  }
  const options = shuffle([correct, ...distractors]);

  q.item = item;
  q.correctText = correct;
  q.options = options;
  q.answered = false;
  q.done++;
  render();
}

function quizAnswer(i) {
  const q = state.quiz;
  if (q.answered) return;
  q.answered = true;
  const chosen = q.options[i];
  const isCorrect = chosen === q.correctText;

  const c = getCard(q.item.kanji);
  if (c.status !== 'new') {
    review(q.item.kanji, isCorrect ? 2 : 0, isCorrect);
  } else {
    const c2 = { ...c };
    c2.correct = (c2.correct || 0) + (isCorrect ? 1 : 0);
    c2.wrong = (c2.wrong || 0) + (isCorrect ? 0 : 1);
    state.progress[q.item.kanji] = c2;
    save();
  }

  if (isCorrect) q.correct++;

  document.querySelectorAll('.opt').forEach((el, j) => {
    el.classList.remove('correct', 'wrong');
    if (q.options[j] === q.correctText) el.classList.add('correct');
    else if (j === i) el.classList.add('wrong');
    el.disabled = true;
  });

  const btn = document.createElement('button');
  btn.className = 'btn btn-primary';
  btn.style = 'width:100%; margin-top:14px;';
  btn.textContent = 'Дальше →';
  btn.onclick = nextQuiz;
  document.querySelector('.opts').after(btn);
}

function continueAfterReview() {
  const newAvail = newCards().slice(0, state.settings.newPerDay);
  if (newAvail.length === 0) {
    toast('Новых кандзи на сегодня нет');
    state.session = null;
    state.tab = 'home';
    render();
    return;
  }
  state.session.stage = 'study';
  state.studyQueue = buildStudyQueue();
  state.studyIndex = 0;
  sessionReviewed = new Set();
  state.tab = 'study';
  render();
}

function finishToday() {
  state.session = null;
  state.tab = 'home';
  render();
}

/* ====================== BROWSE ====================== */
let browseQuery = '';
function renderBrowse() {
  const pool = byLevel(DATA);
  const filtered = pool.filter(d => {
    if (!browseQuery) return true;
    const q = browseQuery.toLowerCase();
    return d.kanji.includes(q)
      || d.meanings.some(m => m.toLowerCase().includes(q))
      || d.on.some(r => r.includes(q))
      || d.kun.some(r => r.includes(q));
  });
  view.innerHTML = `
    <input class="search" id="searchInput" placeholder="Поиск: кандзи, значение, чтение…" value="${browseQuery}">
    <div class="klist">
      ${filtered.slice(0, 500).map(d => {
        const c = getCard(d.kanji);
        return `<div class="kitem" data-status="${c.status}" onclick="openDetail('${d.kanji}')"><span class="dot"></span>${d.kanji}</div>`;
      }).join('')}
    </div>
    <div style="color:var(--muted); font-size:12px; text-align:center; margin-top:14px;">
      Показано: ${Math.min(filtered.length, 500)} из ${filtered.length}
      ${pool.length !== TOTAL ? ` · ${state.levelFilter}` : ''}
    </div>`;
  const input = document.getElementById('searchInput');
  input.addEventListener('input', e => {
    browseQuery = e.target.value;
    renderBrowse();
    const newInput = document.getElementById('searchInput');
    newInput.focus();
    newInput.setSelectionRange(browseQuery.length, browseQuery.length);
  });
}
function openDetail(k) {
  const d = BY_KANJI[k];
  const c = getCard(k);
  const mastery = getMastery(c);
  const dueLabel = c.status === 'new' ? '—' : new Date(c.due).toLocaleDateString('ru-RU');
  view.innerHTML = `
    <button class="btn" style="margin-bottom:14px;" onclick="renderBrowse()">← Назад</button>
    <div class="card flashcard" style="min-height:auto; padding:24px;">
      <div class="kanji" style="font-size:96px;">${d.kanji}</div>
      <div class="hint">${d.level} · Изучено: ${mastery}%</div>
      <div class="back">
        <div class="meanings">${d.meanings.join(', ')}</div>
        ${d.on.length ? `<div class="row"><span class="label">On</span><span class="val">${d.on.join('、')}</span></div>` : ''}
        ${d.kun.length ? `<div class="row"><span class="label">Kun</span><span class="val">${d.kun.join('、')}</span></div>` : ''}
        ${d.examples.length ? `
          <div class="examples">
            ${d.examples.map(e => e.raw
              ? `<div class="ex">${e.raw}</div>`
              : `<div class="ex"><span class="w">${e.word}</span><span class="r">(${e.reading})</span> <span class="m">${e.meaning}</span></div>`
            ).join('')}
          </div>` : ''}
      </div>
      <div class="bar" style="width:100%; margin-top:14px;"><div class="fill" style="width:${mastery}%"></div></div>
    </div>
    <div class="card">
      <div class="row"><span class="label">Статус</span><span class="val">${{new:'Новый',learning:'Учится',review:'Повтор'}[c.status]}</span></div>
      <div class="row"><span class="label">Повтор</span><span class="val">${dueLabel}</span></div>
      <div class="row"><span class="label">Интервал</span><span class="val">${c.interval ? c.interval.toFixed(1) + ' дн.' : '—'}</span></div>
      <div class="row"><span class="label">Ответы</span><span class="val">✅ ${c.correct || 0} · ❌ ${c.wrong || 0}</span></div>
    </div>
    <div class="card">
      <div style="color:var(--muted); font-size:12px; margin-bottom:10px;">Пропиши кандзи пальцем:</div>
      <div class="canvas-wrap">
        <div class="canvas-bg">${d.kanji}</div>
        <canvas id="writeCanvas"></canvas>
      </div>
      <button class="btn" style="width:100%; margin-top:12px;" onclick="clearCanvas()">Очистить</button>
    </div>`;
  initCanvas();
}
function initCanvas() {
  const c = document.getElementById('writeCanvas');
  if (!c) return;
  const rect = c.getBoundingClientRect();
  c.width = rect.width * 2; c.height = rect.height * 2;
  const ctx = c.getContext('2d');
  ctx.scale(2, 2); ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.lineJoin = 'round'; ctx.strokeStyle = '#1a1d24';
  let drawing = false;
  const pos = e => {
    const r = c.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  };
  c.addEventListener('mousedown', e => { drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); });
  c.addEventListener('mousemove', e => { if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); });
  c.addEventListener('mouseup', e => { drawing = false; e.preventDefault(); });
  c.addEventListener('mouseleave', () => { drawing = false; });
  c.addEventListener('touchstart', e => { drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }, { passive: false });
  c.addEventListener('touchmove', e => { if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }, { passive: false });
  c.addEventListener('touchend', e => { drawing = false; e.preventDefault(); });
}
function clearCanvas() {
  const c = document.getElementById('writeCanvas');
  if (!c) return;
  c.getContext('2d').clearRect(0, 0, c.width, c.height);
}

/* ====================== STATS ====================== */
function renderStats() {
  const pool = byLevel(DATA);
  let n = 0, l = 0, r = 0;
  pool.forEach(d => {
    const s = getCard(d.kanji).status;
    if (s === 'new') n++; else if (s === 'learning') l++; else r++;
  });
  const today = new Date().toISOString().slice(0, 10);
  const todayTotal = state.history[today] || 0;
  const todayNew = state.historyNew[today] || 0;
  const todayReviews = Math.max(0, todayTotal - todayNew);
  const streak = calcStreak();
  const totalReviews = Object.values(state.history).reduce((a, b) => a + b, 0);
  const studiedPct = pool.length ? ((pool.length - n) / pool.length * 100).toFixed(0) : 0;
  const levelLabel = state.levelFilter === 'all' ? 'Все уровни' : state.levelFilter;

  const studiedCardsInPool = pool.filter(d => getCard(d.kanji).status !== 'new');
  const avgMastery = studiedCardsInPool.length
    ? Math.round(studiedCardsInPool.reduce((sum, d) => sum + getMastery(getCard(d.kanji)), 0) / studiedCardsInPool.length)
    : 0;

  view.innerHTML = `
    <h2>Прогресс · ${levelLabel}</h2>
    <div class="stat-grid">
      <div class="stat"><div class="n">${r + l}</div><div class="l">Изучено</div><div class="bar"><div class="fill" style="width:${studiedPct}%"></div></div></div>
      <div class="stat"><div class="n">${avgMastery}%</div><div class="l">Средний уровень</div></div>
      <div class="stat"><div class="n">${todayReviews}</div><div class="l">Повторили сегодня</div></div>
      <div class="stat"><div class="n">🔥 ${streak}</div><div class="l">Дней подряд</div></div>
    </div>
    <h2>По статусам</h2>
    <div class="stat-grid">
      <div class="stat"><div class="n" style="color:var(--accent)">${n}</div><div class="l">Новые</div></div>
      <div class="stat"><div class="n" style="color:var(--warn)">${l}</div><div class="l">Учатся</div></div>
      <div class="stat"><div class="n" style="color:var(--good)">${r}</div><div class="l">В повторе</div></div>
      <div class="stat"><div class="n">${dueCards().length}</div><div class="l">К повтору</div></div>
    </div>
    <h2>По уровням</h2>
    <div class="card">
      ${LEVELS.map(lv => {
        const inLv = DATA.filter(d => d.level === lv);
        const done = inLv.filter(d => getCard(d.kanji).status !== 'new').length;
        const pct = inLv.length ? (done / inLv.length * 100).toFixed(0) : 0;
        return `<div style="margin-bottom:10px;">
          <div style="display:flex; justify-content:space-between; font-size:13px;"><span>${lv}</span><span style="color:var(--muted)">${done} / ${inLv.length} · ${pct}%</span></div>
          <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
        </div>`;
      }).join('')}
    </div>
    <h2>Настройки</h2>
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <span class="label" style="text-transform:none; font-size:14px; color:var(--text);">Новых в день</span>
        <span>
          <button class="btn" style="padding:6px 12px;" onclick="changeNew(-5)">−5</button>
          <span style="display:inline-block; width:36px; text-align:center;">${state.settings.newPerDay}</span>
          <button class="btn" style="padding:6px 12px;" onclick="changeNew(5)">+5</button>
        </span>
      </div>
    </div>
    <h2>Данные</h2>
    <div class="card">
      <button class="btn" style="width:100%;" onclick="exportProgress()">📤 Экспорт прогресса</button>
      <button class="btn" style="width:100%; margin-top:8px;" onclick="document.getElementById('importFile').click()">📥 Импорт прогресса</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;" onchange="importProgress(event)">
      <button class="btn" style="width:100%; margin-top:8px; color:var(--bad); border-color:rgba(248,113,113,0.4);" onclick="resetAll()">🗑️ Сбросить всё</button>
    </div>
    <p style="color:var(--muted); font-size:11px; text-align:center; margin-top:20px;">
      Всего повторений: ${totalReviews}<br>
      Данные хранятся в браузере.
    </p>`;
}
function changeNew(d) { state.settings.newPerDay = Math.max(0, state.settings.newPerDay + d); save(); render(); }
function resetAll() {
  if (!confirm('Удалить весь прогресс? Это необратимо.')) return;
  localStorage.removeItem(STORAGE_KEY);
  state.progress = {}; state.history = {}; state.historyNew = {};
  state.studyQueue = []; state.studyIndex = 0;
  state.session = null; state.quiz = null;
  sessionReviewed = new Set();
  render();
}
function exportProgress() {
  const data = { progress: state.progress, settings: state.settings, levelFilter: state.levelFilter, history: state.history, historyNew: state.historyNew, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `kanji-progress-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
  toast('Экспортировано');
}
function importProgress(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      if (!d.progress) throw new Error('no progress');
      if (!confirm('Заменить текущий прогресс?')) return;
      state.progress = d.progress;
      state.settings = d.settings || state.settings;
      state.levelFilter = d.levelFilter || 'all';
      state.history = d.history || {};
      state.historyNew = d.historyNew || {};
      save();
      state.studyQueue = []; state.studyIndex = 0;
      state.session = null; state.quiz = null;
      render();
      toast('Импортировано');
    } catch (err) { alert('Не удалось прочитать файл: ' + err.message); }
  };
  reader.readAsText(file);
}

/* ====================== UTILS ====================== */
function shuffle(a) {
  const r = [...a];
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

/* ====================== CONFIRM MODAL ====================== */
let confirmCallback = null;
function showConfirm(title, onYes) {
  document.getElementById('confirmTitle').textContent = title;
  confirmCallback = onYes;
  document.getElementById('confirmModal').classList.add('open');
}
function hideConfirm() {
  document.getElementById('confirmModal').classList.remove('open');
  confirmCallback = null;
}
document.getElementById('confirmYes').onclick = () => {
  const cb = confirmCallback;
  hideConfirm();
  if (cb) cb();
};
document.getElementById('confirmNo').onclick = hideConfirm;
document.getElementById('confirmModal').addEventListener('click', e => {
  if (e.target.id === 'confirmModal') hideConfirm();
});

/* ====================== BADGE POPUP ====================== */
function toggleBadgePop() {
  const pop = document.getElementById('badgePop');
  if (pop.classList.contains('open')) {
    pop.classList.remove('open');
    return;
  }
  const due = dueCards().length;
  const nw = Math.min(newCards().length, state.settings.newPerDay);
  const today = new Date().toISOString().slice(0, 10);
  const done = state.history[today] || 0;
  const streak = calcStreak();
  pop.innerHTML = `
    <div class="row2">
      <div class="ico2">📅</div>
      <div class="txt"><b>${done}</b> — повторено сегодня.</div>
    </div>
    <div class="row2">
      <div class="ico2">🔔</div>
      <div class="txt"><b>${due + nw}</b> — ждут сейчас.<br>
      Просроченных: <b>${due}</b>, новых: <b>${nw}</b>.</div>
    </div>
    <div class="row2">
      <div class="ico2">🔥</div>
      <div class="txt"><b>${streak}</b> — дней подряд.</div>
    </div>`;
  pop.classList.add('open');
}
document.addEventListener('click', e => {
  const pop = document.getElementById('badgePop');
  if (!pop || !pop.classList.contains('open')) return;
  if (pop.contains(e.target) || headerBadge.contains(e.target)) return;
  pop.classList.remove('open');
});

/* ====================== INIT ====================== */
document.querySelectorAll('nav button').forEach(b => {
  b.addEventListener('click', () => {
    state.tab = b.dataset.tab;
    if (state.tab !== 'practice') state.quiz = null;
    render();
  });
});
document.getElementById('menuBtn').addEventListener('click', openDrawer);
document.getElementById('drawerClose').addEventListener('click', closeDrawer);
drawerOverlay.addEventListener('click', closeDrawer);
headerBadge.addEventListener('click', e => { e.stopPropagation(); toggleBadgePop(); });

let touchStartX = 0;
drawer.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
drawer.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (dx < -60) closeDrawer();
}, { passive: true });

load();
render();
</script>

<!-- PWA -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => {
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          nw?.addEventListener('statechange', () => {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdateToast();
          });
        });
      })
      .catch(err => console.warn('SW:', err));
  });
}
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  showInstallBanner();
});
window.addEventListener('appinstalled', () => { deferredPrompt = null; hideInstallBanner(); toast('Установлено 🎉'); });
if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
  document.documentElement.dataset.pwa = 'true';
}
function showInstallBanner() {
  if (document.getElementById('installBanner')) return;
  const el = document.createElement('div');
  el.id = 'installBanner';
  el.innerHTML = `
    <div style="position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 70px);background:var(--card2);border:1px solid var(--border);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,0.4);z-index:90;">
      <div style="font-size:28px;">📱</div>
      <div style="flex:1;font-size:13px;">Установить Kanji Study?</div>
      <button id="installYes" style="background:var(--accent);color:#0b1020;border:0;padding:8px 14px;border-radius:10px;font-weight:600;font-family:inherit;cursor:pointer;">Да</button>
      <button id="installNo" style="background:transparent;color:var(--muted);border:0;padding:8px;font-family:inherit;cursor:pointer;">✕</button>
    </div>`;
  document.body.appendChild(el);
  document.getElementById('installYes').onclick = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const choice = await deferredPrompt.userChoice;
    if (choice.outcome === 'accepted') hideInstallBanner();
    deferredPrompt = null;
  };
  document.getElementById('installNo').onclick = hideInstallBanner;
}
function hideInstallBanner() { document.getElementById('installBanner')?.remove(); }
function showUpdateToast() {
  if (document.getElementById('updateToast')) return;
  const el = document.createElement('div');
  el.id = 'updateToast';
  el.innerHTML = `
    <div style="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 80px);background:var(--accent);color:#0b1020;padding:12px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:95;box-shadow:0 8px 24px rgba(108,158,255,0.4);display:flex;align-items:center;gap:10px;">
      <span>Доступно обновление</span>
      <button id="reloadBtn" style="background:#0b1020;color:var(--accent);border:0;padding:6px 12px;border-radius:999px;font-family:inherit;font-weight:600;cursor:pointer;">Обновить</button>
    </div>`;
  document.body.appendChild(el);
  document.getElementById('reloadBtn').onclick = () => {
    navigator.serviceWorker.getRegistration().then(reg => {
      reg?.waiting?.postMessage('SKIP_WAITING');
      setTimeout(() => window.location.reload(), 300);
    });
  };
}
</script>
